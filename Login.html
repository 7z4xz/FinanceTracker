<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up - Ledger Finance</title>
    
    <!-- Google Font & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <!-- Link ke CSS Utama -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BACKGROUND ANIMATION (GLOW & TRIANGLES) -->
    <div class="bg-animation">
        <div class="glow-shape g-1"></div>
        <div class="glow-shape g-2"></div>
        <div class="glow-shape g-3"></div>
        <div class="triangle-shape tr-1"></div>
        <div class="triangle-shape tr-2"></div>
        <div class="triangle-shape tr-3"></div>
        <div class="triangle-shape tr-4"></div>
    </div>

    <!-- SPLASH SCREEN / DINAMIS WELCOME SAAT BERHASIL MASUK -->
    <div id="splash-screen" class="screen-layer hidden-scene">
        <h1 class="welcome-text" id="dynamic-welcome-text">Welcome</h1>
    </div>

    <!-- FASE AUTHENTICATION (LOGIN / SIGN UP) -->
    <div id="auth-screen" class="screen-layer">
        <div class="glass-panel">
            <div class="auth-header">
                <h2 id="form-title">Ledger</h2>
                <p id="form-subtitle">Log in to your account</p>
            </div>
            
            <form id="auth-form">
                <!-- Input Nama Lengkap (Hanya muncul saat mode Sign Up) -->
                <div class="input-group" id="name-group" style="display: none;">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="signup-nama" placeholder="Nama Lengkap" autocomplete="off">
                </div>

                <div class="input-group">
                    <i class="fa-regular fa-user"></i>
                    <input type="text" id="login-username" placeholder="Username" required autocomplete="off">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="login-password" placeholder="Password" required>
                </div>
                
                <button type="submit" class="auth-btn" id="auth-submit-btn">Continue</button>
            </form>
            
            <div class="auth-footer">
                <p id="footer-text">Don't have an account? <a href="#" id="toggle-mode">Sign up</a></p>
            </div>
        </div>
    </div>

    <script>
        // 1. Konfigurasi URL API Apps Script Anda
        const API_URL = "https://script.google.com/macros/s/AKfycbyASLjcGWxb3pAPh54oisnK1BgESpXww_mG1BNbPSEHVqgoocWRiBMbABkB33OJPcpR/exec";

        // 2. Set Tema Gelap/Terang Sesuai Memori Terakhir
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
        }

        // 3. Logika Toggle antara Login & Sign Up
        let isSignUp = false;
        const toggleModeBtn = document.getElementById("toggle-mode");
        const nameGroup = document.getElementById("name-group");
        const formTitle = document.getElementById("form-title");
        const formSubtitle = document.getElementById("form-subtitle");
        const submitBtn = document.getElementById("auth-submit-btn");
        const footerText = document.getElementById("footer-text");

        toggleModeBtn.addEventListener("click", (e) => {
            e.preventDefault();
            isSignUp = !isSignUp;
            
            if (isSignUp) {
                nameGroup.style.display = "block";
                formTitle.innerText = "Create Account";
                formSubtitle.innerText = "Sign up to start tracking finance";
                submitBtn.innerText = "Sign Up";
                footerText.innerHTML = `Already have an account? <a href="#" id="toggle-mode">Log in</a>`;
            } else {
                nameGroup.style.display = "none";
                formTitle.innerText = "Ledger";
                formSubtitle.innerText = "Log in to your account";
                submitBtn.innerText = "Continue";
                footerText.innerHTML = `Don't have an account? <a href="#" id="toggle-mode">Sign up</a>`;
            }
            
            // Re-bind event listener karena innerHTML mereset elemen link toggle
            document.getElementById("toggle-mode").addEventListener("click", arguments.callee);
        });

        // 4. Logika Submit Form (Login / Sign Up ke Google Sheets)
        const authForm = document.getElementById("auth-form");
        authForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const username = document.getElementById("login-username").value.trim();
            const password = document.getElementById("login-password").value.trim();
            const namaInput = document.getElementById("signup-nama").value.trim();
            const nama = isSignUp ? namaInput : "";

            if (isSignUp && !nama) {
                alert("Mohon masukkan nama lengkap Anda!");
                return;
            }

            submitBtn.innerText = "Processing...";
            submitBtn.disabled = true;

            const payload = isSignUp 
                ? { action: "signup", username, password, nama }
                : { action: "login", username, password };

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                
                if (result.status === "success") {
                    // Simpan identitas user yang aktif ke browser
                    localStorage.setItem("ledger_user", username);
                    localStorage.setItem("ledger_name", result.nama);

                    // Sembunyikan panel form kaca
                    document.getElementById("auth-screen").classList.add("hidden-scene");

                    // Siapkan sapaan sinematik kustom
                    const splashScreen = document.getElementById("splash-screen");
                    const welcomeText = document.getElementById("dynamic-welcome-text");
                    
                    welcomeText.innerText = isSignUp ? `Welcome, ${result.nama}` : `Welcome back, ${result.nama}`;
                    splashScreen.classList.remove("hidden-scene");

                    // TRIGGER ANIMASINYA DI SINI! (Seperti menekan tombol play)
                    welcomeText.classList.add("animate-welcome");

                    // Jeda animasi selama 2.5 detik, lalu pindah mulus ke index.html
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 2500);

                } else {
                    alert(result.message);
                    submitBtn.innerText = isSignUp ? "Sign Up" : "Continue";
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Gagal terhubung ke server. Periksa koneksi internet Anda.");
                submitBtn.innerText = isSignUp ? "Sign Up" : "Continue";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
